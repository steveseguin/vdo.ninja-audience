name: URL contract
on:
  pull_request:
    paths:
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/link.rs'
      - 'tests/url-contract/**'
      - '.github/workflows/url-contract.yml'
permissions:
  contents: read
jobs:
  url-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production URL builder without native GUI dependencies
        run: cargo test --manifest-path tests/url-contract/Cargo.toml
